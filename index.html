<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tramo en 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Espacio patrocinado: grafito casi negro, blanco, grises neutros y naranja como único acento.
     Layout: escenario 3D arriba con datos en vivo y perfil de altura; ficha del tramo debajo. */
  --navy:#0d0d0f; --navy-2:#17181b; --navy-3:#222327; --line:#383a40;
  --ink:#ffffff; --dim:#a7abb2; --sky:#c9cdd3; --yellow:#ff6a13;
  --font:"Jost","Futura","Century Gothic","Trebuchet MS",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--navy);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
.app{max-width:1400px;margin:0 auto;padding:20px 20px 48px;display:flex;flex-direction:column;gap:18px}
.stage{position:relative;width:100%;aspect-ratio:16/9;background:#0a0a0c;border:1px solid var(--line);overflow:hidden;container-type:inline-size}
.stage canvas.gl{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage.v{aspect-ratio:9/16;width:min(100%,calc(84vh*9/16));margin:0 auto}
.status{color:var(--dim);font-size:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.btn:disabled{opacity:.45;cursor:default}
.hud{position:absolute;pointer-events:none;text-transform:uppercase}
.scrim{inset:0 0 auto 0;height:26%;background:linear-gradient(rgba(10,10,12,.82),rgba(10,10,12,0))}
.title{left:2.4cqw;top:2.2cqw;display:flex;gap:1.4cqw;align-items:flex-start}
.intro img{display:none;max-width:38cqw;max-height:16cqw;background:#fff;padding:1.6cqw 2.4cqw}
.intro.has img{display:block}.intro.has b{display:none}
.sponsor{right:2.4cqw;bottom:27.5%;display:none;flex-direction:column;align-items:flex-end;gap:.5cqw}
.sponsor span{font-weight:600;font-size:.95cqw;letter-spacing:.3em;color:var(--dim)}
.sponsor img{display:block;width:17cqw;height:auto;background:#fff;padding:.9cqw 1.3cqw}
.stage.logo .sponsor{display:flex}.stage.logo .pres{display:none}
.bar{width:.5cqw;align-self:stretch;background:var(--yellow);transform:skewX(-12deg)}
.eyebrow{font-weight:600;font-size:1.15cqw;letter-spacing:.28em;color:var(--sky)}
.pe{font-weight:700;font-size:4.6cqw;line-height:1;letter-spacing:.01em}
.name{font-weight:500;font-size:1.5cqw;letter-spacing:.08em;margin-top:.3cqw}
.pres{display:inline-block;margin-top:.8cqw;background:var(--yellow);color:#0d0d0f;font-weight:500;font-size:1.05cqw;letter-spacing:.22em;padding:.3cqw .9cqw}
.pres b{font-weight:700}
.intro{inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6cqw;opacity:0}
.intro span{font-weight:500;font-size:1.5cqw;letter-spacing:.5em;color:var(--dim)}
.intro b{font-weight:700;font-size:7cqw;letter-spacing:.12em;line-height:1;color:var(--yellow)}
.live{right:2.4cqw;top:2.2cqw;display:grid;grid-template-columns:repeat(3,auto);gap:0 2.2cqw;text-align:right}
.live .k{font-weight:600;font-size:.95cqw;letter-spacing:.24em;color:var(--dim)}
.live .v{font-weight:700;font-size:2.7cqw;line-height:1.1;font-variant-numeric:tabular-nums;text-transform:none}
.live .v small{font-size:.48em;font-weight:500;color:var(--dim);margin-left:.25em}
.profile{left:0;right:0;bottom:0;height:24%}
.profile canvas{width:100%;height:100%;display:block}
.exag{left:2.4cqw;bottom:25.5%;font-size:.9cqw;letter-spacing:.2em;color:var(--dim);font-weight:500}
.endcard{right:2.4cqw;top:11cqw;width:30cqw;background:rgba(13,13,15,.9);border-left:.35cqw solid var(--yellow);padding:1.4cqw 1.6cqw;opacity:0;transition:opacity .8s;text-transform:none}
.endcard.on{opacity:1}
.endcard h3{margin:0 0 .8cqw;font-size:1.05cqw;letter-spacing:.26em;font-weight:600;color:var(--sky);text-transform:uppercase}
.endcard dl{margin:0;display:grid;grid-template-columns:1fr auto;gap:.35cqw 1cqw;font-size:1.25cqw}
.endcard dt{color:var(--dim)}.endcard dd{margin:0;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.transport{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.btn{background:var(--navy-2);border:1px solid var(--line);padding:9px 16px;cursor:pointer;font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:14px}
.btn:hover{border-color:var(--sky)}
.btn.primary{background:var(--yellow);border-color:var(--yellow);color:#0d0d0f;min-width:128px}
.btn[aria-pressed=true]{background:var(--sky);border-color:var(--sky);color:#0d0d0f}
input[type=range]{flex:1;min-width:160px;accent-color:var(--yellow)}
.grp{display:flex;align-items:center;gap:6px}
.grp span{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-right:4px}
h2{font-weight:700;font-size:22px;letter-spacing:.14em;text-transform:uppercase;margin:14px 0 0;display:flex;align-items:center;gap:12px}
h2::before{content:"";width:8px;height:22px;background:var(--yellow);transform:skewX(-12deg)}
.lead{margin:0;max-width:72ch;color:var(--dim);font-size:17px}
.lead strong{color:var(--ink);font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.tile{background:var(--navy-2);border:1px solid var(--line);padding:14px 16px}
.tile .k{font-size:12.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);font-weight:600}
.tile .v{font-size:30px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
.tile .v small{font-size:.5em;font-weight:500;color:var(--dim);margin-left:.3em}
.tile .s{font-size:14px;color:var(--dim);margin-top:2px}
.tile.w{border-color:var(--sky)}
.cfg{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.cfg fieldset{border:1px solid var(--line);background:var(--navy-2);margin:0;padding:14px 16px 16px;display:grid;grid-template-columns:1fr 1fr;gap:12px;align-content:start;min-width:0}
.cfg legend{font-size:12.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);font-weight:600;padding:0 6px}
.cfg label{display:flex;flex-direction:column;gap:5px;font-size:14px;color:var(--dim);grid-column:1/-1;min-width:0}
.cfg fieldset:nth-of-type(2) label:not(.wide):not(:first-of-type){grid-column:auto}
.cfg input[type=text],.cfg input[type=date],.cfg input[type=time],.cfg select{background:var(--navy);border:1px solid var(--line);padding:8px 10px;color:var(--ink);width:100%;min-width:0}
.cfg input[type=file]{font-size:13px;color:var(--ink);max-width:100%}
.cfg input[type=color]{width:64px;height:36px;padding:0;border:1px solid var(--line);background:none}
.cfg .row{grid-column:1/-1;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.cfg label.chk{flex-direction:row;align-items:center;gap:8px;color:var(--ink);grid-column:auto}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);flex-wrap:wrap}
.tab{background:transparent;border:0;border-bottom:4px solid transparent;margin-bottom:-2px;padding:12px 18px;cursor:pointer;font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-size:15px;color:var(--dim)}
.tab:hover{color:var(--ink)}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--yellow)}
.btn.sm{padding:5px 10px;font-size:12px;text-decoration:none;display:inline-block}
.cfg fieldset.cmp{grid-column:1/-1;order:-1}
.cfg textarea{background:var(--navy);border:1px solid var(--line);padding:8px 10px;color:var(--ink);width:100%;font:13px/1.4 ui-monospace,Menlo,monospace;resize:vertical}
.hintx{font-size:13px;color:var(--dim)}
.pick{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px}
.pick label{flex-direction:row;align-items:center;gap:8px;color:var(--ink);background:var(--navy);border:1px solid var(--line);padding:6px 10px;font-size:14px;grid-column:auto}
.pick label span{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--dim)}
.cfg .go{grid-column:1/-1;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.status.err{color:#ff9a8a}
.fine{color:var(--dim);font-size:14px;max-width:80ch;margin:0}
@media (max-width:640px){.app{padding:16px}.endcard{width:44cqw}.endcard dl{font-size:1.9cqw}.endcard h3{font-size:1.6cqw}}
</style>
</head>
<body>
<div class="app">
  <div class="tabs" role="tablist" aria-label="Tipo de animación">
    <button class="tab" role="tab" id="tab1" type="button" aria-selected="true" aria-controls="stage">1 · Recorrido del tramo</button>
    <button class="tab" role="tab" id="tab2" type="button" aria-selected="false" aria-controls="stage">2 · Comparativa de pilotos</button>
  </div>
  <div class="stage" id="stage">
    <canvas class="gl" id="gl" role="img" aria-label="Recorrido del tramo en 3D con relieve"></canvas>
    <canvas class="gl" id="hud"></canvas>
  </div>
  <div class="transport">
    <button class="btn primary" id="expH" type="button">Exportar video horizontal</button>
    <button class="btn primary" id="expV" type="button">Exportar video vertical</button>
    <button class="btn" id="wxBtn" type="button" aria-pressed="false">Agregar clima del horario del tramo</button>
  </div>
  <div class="transport"><span class="status" id="status" role="status"></span></div>

  <h2>Configurar el tramo</h2>
  <form class="cfg" id="cfg" onsubmit="return false">
    <fieldset><legend>Recorrido</legend>
      <label for="fFile">Archivo de la carrera (KMZ, KML o GPX)<input type="file" id="fFile" accept=".kmz,.kml,.gpx"></label>
      <label for="fTrack">Tramo dentro del archivo<select id="fTrack" disabled><option>Cargá un archivo primero</option></select></label>
    </fieldset>
    <fieldset><legend>Datos del tramo</legend>
      <label for="fRally">Rally o evento<input type="text" id="fRally"></label>
      <label for="fPe">Tramo<input type="text" id="fPe" placeholder="PE 2"></label>
      <label for="fName" class="wide">Nombre del tramo<input type="text" id="fName" placeholder="Se completa solo si el archivo lo trae"></label>
      <label for="fKm">Distancia oficial (km)<input type="text" id="fKm" inputmode="decimal"></label>
      <label for="fDate">Fecha<input type="date" id="fDate"></label>
      <label for="fTime">Hora de largada<input type="time" id="fTime"></label>
    </fieldset>
    <fieldset><legend>Marcas</legend>
      <label for="fSponsor">Logo del sponsor<input type="file" id="fSponsor" accept="image/*"></label>
      <div class="row"><label class="chk" for="fSpPlate"><input type="checkbox" id="fSpPlate"> Sobre placa blanca</label><button class="btn sm" type="button" id="xSponsor">Quitar logo del sponsor</button></div>
      <label for="fPresenta">Texto sobre el logo<input type="text" id="fPresenta"></label>
      <label for="fSponsorName">Nombre del sponsor (si no hay logo)<input type="text" id="fSponsorName"></label>
      <label for="fCat">Logo de la categoría o campeonato<input type="file" id="fCat" accept="image/*"></label>
      <div class="row"><label class="chk" for="fCatPlate"><input type="checkbox" id="fCatPlate"> Sobre placa blanca</label><button class="btn sm" type="button" id="xCat">Quitar logo de la categoría</button></div>
    </fieldset>
    <fieldset class="cmp" id="cmpBox" hidden><legend>Pilotos de la comparativa</legend>
      <div class="row"><a class="btn sm" id="apiLink" href="#" target="_blank" rel="noopener">Abrir los tiempos de este tramo</a><span class="hintx">Rally Argentino: se abre una página de datos. Seleccioná todo, copiá y pegá acá abajo.</span></div>
      <label for="fShot">Captura de pantalla de los tiempos del tramo (o pegala con Ctrl+V)<input type="file" id="fShot" accept="image/*"></label>
      <label for="fTimes">Tiempos del tramo<textarea id="fTimes" rows="6" placeholder="Se completa con la captura. También podés pegar los datos copiados o escribir una línea por piloto: número; piloto; tiempo"></textarea></label>
      <div class="row"><button class="btn sm" type="button" id="readTimes">Leer tiempos</button><span class="hintx" id="timesMsg"></span></div>
      <div class="pick" id="pick"></div>
    </fieldset>
    <fieldset><legend>Estilo</legend>
      <label for="fAccent">Color de acento<input type="color" id="fAccent"></label>
      <label for="fDur">Duración del video<select id="fDur"><option value="0">Automática, según el tramo</option><option value="20">20 segundos</option><option value="30">30 segundos</option><option value="45">45 segundos</option><option value="60">60 segundos</option><option value="90">90 segundos</option></select></label>
      <label for="fEx">Relieve<select id="fEx"><option value="1.5">Ampliado ×1,5</option><option value="2.5">Ampliado ×2,5</option><option value="4">Ampliado ×4</option></select></label>
    </fieldset>
    <div class="go"><button class="btn primary" type="button" id="gen">Generar animación</button><span class="status" id="genStatus" role="status"></span></div>
  </form>

  <h2>Ficha del tramo</h2>
  <p class="lead" id="lead"></p>
  <div class="tiles" id="tiles"></div>
  <h2>Clima a la hora del tramo</h2>
  <div class="tiles" id="wx"></div>
  <p class="fine" id="fine"></p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<script>
'use strict';
const A64='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';
function varints(s){const o=[];let i=0;while(i<s.length){let v=0,sh=0,b;do{b=A64.indexOf(s[i++]);v|=(b&31)<<sh;sh+=5}while(b>=32);o.push((v&1)?~(v>>>1):(v>>>1))}return o}
const cumsum=a=>{let p=0;return a.map(v=>p+=v)};
const es=(x,d=1)=>x.toFixed(d).replace('.',',');
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
const $=id=>document.getElementById(id);

function boot(TR,WX,CFG){
const [LA0,LA1,LO0,LO1]=TR.bbox,LAC=(LA0+LA1)/2,LOC=(LO0+LO1)/2,KX=111320*Math.cos(LAC*Math.PI/180),KY=110540;
const toXY=(la,lo)=>[(lo-LOC)*KX,(la-LAC)*KY];
const G=TR.G,PR0=TR.P;
const sm0=a=>a.map((v,i)=>{let s=0,n=0;for(let k=-2;k<=2;k++){const q=a[i+k];if(q!==undefined){s+=q;n++}}return s/n});const PR=sm0(sm0(PR0));
const LL=TR.LL.map(p=>toXY(p[0],p[1]));

const loadScript=src=>new Promise((res,rej)=>{const e=document.createElement('script');e.src=src;e.onload=res;e.onerror=()=>rej(new Error('no cargó'));document.head.appendChild(e)});
// arma las filas de la tabla con la posición de cada palabra: el ancla de cada fila es su tiempo
function rowsFromWords(words){const W=words.filter(w=>w.text&&w.bbox).map(w=>({t:w.text.trim(),x0:w.bbox.x0,x1:w.bbox.x1,yc:(w.bbox.y0+w.bbox.y1)/2,h:w.bbox.y1-w.bbox.y0})).filter(w=>w.t);
  const isT=t=>/^(?:\d+:)?\d{1,2}:\d{2}[.,]?\d$/.test(t),times=W.filter(w=>isT(w.t)&&!/^\+/.test(w.t)).sort((a,b)=>a.yc-b.yc),anchors=[];
  for(const w of times){const last=anchors[anchors.length-1];if(last&&Math.abs(w.yc-last.yc)<w.h*.8){if(w.x0<last.x0)anchors[anchors.length-1]=w}else anchors.push(w)}
  if(anchors.length<2)return[];const gaps=anchors.slice(1).map((a,i)=>a.yc-anchors[i].yc).sort((a,b)=>a-b),half=gaps[Math.floor(gaps.length/2)]*.5,out=[];
  for(const a of anchors){const row=W.filter(w=>Math.abs(w.yc-a.yc)<half&&w.x1<=a.x0+2),letters=row.filter(w=>/[A-Za-zÁÉÍÓÚÑáéíóúñ]{2}/.test(w.t));if(!letters.length)continue;
    const top=Math.min(...letters.map(w=>w.yc)),line=letters.filter(w=>w.yc-top<a.h*.42).sort((p,q)=>p.x0-q.x0),nm=[line[0]];for(let i=1;i<line.length;i++){if(line[i].x0-nm[nm.length-1].x1>a.h*2.2)break;nm.push(line[i])}
    const nums=row.filter(w=>/^#?\d{1,3}$/.test(w.t)&&w.x1<=nm[0].x0).sort((p,q)=>p.x0-q.x0);let name=nm.map(w=>w.t).join(' ');
    const k=name.match(/^((?:[A-ZÁÉÍÓÚÑ][a-záéíóúñ.']+\s+){0,4}(?:[A-ZÁÉÍÓÚÑ][A-ZÁÉÍÓÚÑ']+(?:\s+\(h\))?(?:\s+|$))+)/);if(k&&k[1].trim().length>=4)name=k[1].trim();
    const T=toSec(a.t);if(T&&name)out.push({n:nums.length?+nums[nums.length-1].t.replace('#',''):out.length+1,name,T})}
  return out}
async function readShot(file){const msg=m=>{$('timesMsg').textContent=m};try{msg('Preparando el lector de capturas…');if(!window.Tesseract)await loadScript(TESS.js);
    const bm=await createImageBitmap(file),k=clamp(2400/bm.width,1,3),c=document.createElement('canvas');c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);const x=c.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(bm,0,0,c.width,c.height);
    const im=x.getImageData(0,0,c.width,c.height),d=im.data;let sum=0;for(let i=0;i<d.length;i+=4){const g=.299*d[i]+.587*d[i+1]+.114*d[i+2];d[i]=g;sum+=g}const dark=sum/(d.length/4)<128;
    for(let i=0;i<d.length;i+=4){let g=dark?255-d[i]:d[i];g=clamp((g-60)*1.5,0,255);d[i]=d[i+1]=d[i+2]=g}x.putImageData(im,0,0);
    const w=await Tesseract.createWorker('spa',1,{workerPath:TESS.worker,corePath:TESS.core,langPath:TESS.lang,logger:m=>{if(m.status==='recognizing text')msg('Leyendo la captura… '+Math.round(m.progress*100)+' %')}});
    await w.setParameters({preserve_interword_spaces:'1',tessedit_pageseg_mode:'6'});const r=await w.recognize(c);await w.terminate();
    let rows=rowsFromWords(r.data.words||[]);if(rows.length<2)rows=parseTimes(r.data.text);if(!rows.length){msg('No pude leer tiempos en la captura. Probá con una captura más grande y nítida, que incluya número, piloto y tiempo.');return}
    $('fTimes').value=rows.map(c=>{const m=Math.floor(c.T/60);return c.n+'; '+c.name+'; '+m+':'+(c.T-m*60).toFixed(1).padStart(4,'0')}).join('\n');showTimes();
    msg(rows.length+' pilotos leídos de la captura. Revisá números, nombres y tiempos contra la captura antes de generar: la lectura automática puede confundir algún dígito.')}
  catch(e){msg('No se pudo leer la captura ('+(e.message||e)+'). Dentro de Claude no funciona; sí con la página publicada.')}}
$('fShot').onchange=e=>{const f=e.target.files[0];if(f)readShot(f)};
document.addEventListener('paste',e=>{const it=[...(e.clipboardData||{items:[]}).items].find(i=>i.type&&i.type.indexOf('image/')===0);if(it){e.preventDefault();readShot(it.getAsFile())}});
function apiHref(){const n=(($('fPe').value.match(/\d+/)||[])[0]);return n?'https://api.rallyargentino.com/api/v2/tiempos/general/pe/'+n:'https://tiemposonline.rallyargentino.com/'}
$('apiLink').onclick=()=>{$('apiLink').href=apiHref()};
// ---------- formulario ----------
const DEMO={geo:{LL:(()=>{const v=varints(TR.track),o=[];let la=0,lo=0;for(let i=0;i<v.length;i+=2){la+=v[i];lo+=v[i+1];o.push([la/1e5,lo/1e5])}return o})(),bbox:TR.bbox,nx:TR.nx,ny:TR.ny,G:cumsum(varints(TR.grid)),P:cumsum(varints(TR.prof)),len:TR.km*1000,src:'Open-Meteo (Copernicus, celdas de 90 m)'},wx:Object.assign({past:true},WX),wxKey:'2026-11-07|10:48'};
function fields(){return{rally:$('fRally').value.trim(),pe:$('fPe').value.trim(),name:$('fName').value.trim(),km:parseFloat(String($('fKm').value).replace(',','.')),date:$('fDate').value,time:$('fTime').value,presenta:$('fPresenta').value.trim(),sponsorName:$('fSponsorName').value.trim(),spPlate:$('fSpPlate').checked,catPlate:$('fCatPlate').checked,accent:$('fAccent').value,ex:parseFloat($('fEx').value),dur:parseFloat($('fDur').value)||0}}
function saveBrand(){const f=fields(),o=store.get();store.set({...o,rally:f.rally,presenta:f.presenta,sponsorName:f.sponsorName,spPlate:f.spPlate,catPlate:f.catPlate,accent:f.accent,ex:f.ex,dur:f.dur})}
async function generate(){const btn=$('gen');btn.disabled=true;try{
    const f=fields();if(APP.pending){say('Preparando el recorrido…');APP.geo=await fetchTerrain(APP.pending,say);APP.pending=null;APP.wxKey=''}
    const geo=APP.geo,km=f.km>0?f.km:geo.len/1000,mid=geo.LL[0],key=f.date&&f.time?f.date+'|'+f.time:'';
    if(key!==APP.wxKey){APP.wx=null;if(key){say('Consultando el clima de esa fecha y hora…');APP.wx=await fetchWeather(mid[0],mid[1],f.date,f.time)}APP.wxKey=key}
    say('Armando la animación…');await new Promise(r=>setTimeout(r,30));
    const tr={rally:f.rally,pe:f.pe,name:f.name,sub:'',sponsor:f.sponsorName,km,bbox:geo.bbox,nx:geo.nx,ny:geo.ny,G:geo.G,P:geo.P,LL:geo.LL,src:geo.src};
    const cfg={accent:/^#[0-9a-f]{6}$/i.test(f.accent)?f.accent:'#ff6a13',ex:f.ex||2.5,dur:f.dur,cmp:APP.tab===2?APP.times.filter(c=>APP.sel.has(c.n)):null,presenta:f.presenta,sponsorImg:await loadImg(APP.logos.sponsor),catImg:await loadImg(APP.logos.cat),sponsorPlate:f.spPlate,catPlate:f.catPlate};
    if(APP.tab===2&&(!cfg.cmp||cfg.cmp.length<2)){showTimes();cfg.cmp=APP.times.filter(c=>APP.sel.has(c.n));if(cfg.cmp.length<2){say('Para la comparativa hacen falta al menos dos pilotos con tiempo. Pegá los tiempos y tocá «Leer tiempos».',true);btn.disabled=false;return}}
    document.documentElement.style.setProperty('--yellow',cfg.accent);
    if(APP.eng)APP.eng.stop();APP.eng=boot(tr,APP.wx,cfg);saveBrand();
    say(key&&!APP.wx?'Listo. No hay datos de clima para esa fecha: el servicio cubre unos tres meses hacia atrás y 16 días hacia adelante.':'Listo.');
  }catch(e){say(e.message||String(e),true)}btn.disabled=false}
function fillTracks(){const s=$('fTrack');s.innerHTML='';APP.tracks.forEach((t,i)=>{const o=document.createElement('option');o.value=i;o.textContent=(t.name||'Recorrido '+(i+1))+' · '+es(t.len/1000,2)+' km';s.appendChild(o)});s.disabled=!APP.tracks.length;if(APP.tracks.length)pickTrack(0)}
function pickTrack(i){const t=APP.tracks[i];if(!t)return;APP.pending=simplify(t.pts,3);if(t.name){const m=t.name.match(/^\s*((?:PE|SS|TC|PS|SP|ES)\s*\.?\s*\d+)\s*[-–:.]?\s*(.*)$/i);if(m){$('fPe').value=m[1].toUpperCase().replace(/\s*\.?\s*(\d)/,' $1');$('fName').value=m[2]||''}else $('fName').value=t.name}$('fKm').value='';$('fKm').placeholder=es(t.len/1000,2)+' (medida sobre el recorrido)';say('Recorrido elegido: '+(t.name||'sin nombre')+', '+es(t.len/1000,2)+' km. Completá los datos y tocá «Generar animación».')}
$('fFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{say('Leyendo '+f.name+'…');APP.tracks=await readTrackFile(f);fillTracks();if(APP.tracks.length>1)say('El archivo trae '+APP.tracks.length+' recorridos. Elegí el tramo en la lista.')}catch(err){say(err.message||String(err),true)}};
$('fTrack').onchange=e=>pickTrack(+e.target.value);
$('gen').onclick=generate;
// ---------- solapas ----------
APP.tab=1;const TABS={1:'recorrido',2:'comparativa'};
function setTab(n,run){APP.tab=n;[1,2].forEach(k=>$('tab'+k).setAttribute('aria-selected',String(k===n)));$('cmpBox').hidden=n!==2;$('wxBtn').hidden=false;try{history.replaceState(null,'','#'+TABS[n])}catch(e){}if(run)generate()}
$('tab1').onclick=()=>setTab(1,true);$('tab2').onclick=()=>setTab(2,true);
[['sponsor','fSponsor','xSponsor'],['cat','fCat','xCat']].forEach(([k,inp,x])=>{
  $(inp).onchange=async e=>{const f=e.target.files[0];if(!f)return;APP.logos[k]=await fileToDataURL(f);const o=store.get();o[k+'Logo']=APP.logos[k];store.set(o);$(x).hidden=false;say('Logo cargado. Tocá «Generar animación» para verlo.')};
  $(x).onclick=()=>{APP.logos[k]=null;const o=store.get();o[k+'Logo']='none';store.set(o);$(inp).value='';$(x).hidden=true;say('Logo quitado. Tocá «Generar animación» para aplicar.')}});
// arranque: ejemplo cargado + marca guardada
(async()=>{const b=store.get();APP.geo=DEMO.geo;APP.wx=DEMO.wx;APP.wxKey=DEMO.wxKey;
  $('fRally').value=b.rally||TR.rally;$('fPe').value=TR.pe;$('fName').value=TR.name;$('fKm').value=String(TR.km).replace('.',',');$('fDate').value='2026-11-07';$('fTime').value='10:48';
  $('fPresenta').value=b.presenta!=null?b.presenta:'Presenta';$('fSponsorName').value=b.sponsorName||'';$('fSpPlate').checked=b.spPlate!==false;$('fCatPlate').checked=!!b.catPlate;$('fAccent').value=b.accent||'#ff6a13';$('fEx').value=String(b.ex||2.5);$('fDur').value=String(b.dur||0);
  APP.logos.sponsor=b.sponsorLogo==='none'?null:(b.sponsorLogo||SPONSOR_LOGO);APP.logos.cat=b.catLogo==='none'?null:(b.catLogo||CODASUR_LOGO);$('xSponsor').hidden=!APP.logos.sponsor;$('xCat').hidden=!APP.logos.cat;
  $('fTimes').value=DEMO_TIMES;showTimes();setTab(location.hash==='#comparativa'?2:1,false);
  await generate();say('Ejemplo cargado: PE 2 del Rally de Traslasierra. Cargá un KMZ, KML o GPX para armar otro tramo.')})();
</script>
